<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RideSphere | Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Times New Roman", Times, serif;

            min-height: 100vh;

            display: flex;
            justify-content: flex-end;
            align-items: center;

            padding-right: 100px;
        }

        /* Background Image */

        .car-image {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            z-index: -1;
        }

        /* Login Box */

        .login-box {
            width: 400px;

            padding: 35px;

            background: rgba(33, 20, 15, 0.92);

            border: 1px solid #5A3A2B;

            z-index: 1;
        }

        .login-box h1 {
            text-align: center;

            color: #E8DDD2;

            font-size: 32px;

            margin-bottom: 30px;
        }

        label {
            display: block;

            color: #E8DDD2;

            font-size: 17px;

            margin-bottom: 7px;
        }

        input {
            width: 100%;

            padding: 11px;

            margin-bottom: 20px;

            background: #0D0907;

            color: #E8DDD2;

            border: 1px solid #5A3A2B;

            font-family: "Times New Roman", Times, serif;

            font-size: 16px;

            outline: none;
        }

        input::placeholder {
            color: #9B8C82;
        }

        input:focus {
            border-color: #E8DDD2;
        }

        button {
            width: 100%;

            padding: 12px;

            background: #E8DDD2;

            color: #21140F;

            border: none;

            font-family: "Times New Roman", Times, serif;

            font-size: 18px;

            cursor: pointer;
        }

        button:hover {
            background: #D4C5B8;
        }

        /* Register Link */

        .register-link {
            text-align: center;

            margin-top: 20px;

            color: #E8DDD2;

            font-size: 16px;
        }

        .register-link a {
            color: #E8DDD2;

            font-weight: bold;

            text-decoration: underline;
        }

        .register-link a:hover {
            color: #D4C5B8;
        }

    </style>

</head>


<body>

    <!-- Background Image -->

    <img src="bike.png" class="car-image">


    <!-- Login Form -->

    <div class="login-box">

        <h1>Login</h1>

       <form id="loginForm">

            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label for="mobile">Mobile</label>

            <input
                type="tel"
                id="mobile"
                name="mobile"
                placeholder="Enter your mobile number"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>
		<script>
		document.getElementById("loginForm").addEventListener("submit", async function(event) {

		    event.preventDefault();

		    const email = document.getElementById("email").value;
		    const mobile = document.getElementById("mobile").value;

		    try {

		        const response = await fetch("http://localhost:8081/customers/login", {
		            method: "POST",
		            headers: {
		                "Content-Type": "application/json"
		            },
		            body: JSON.stringify({
		                email: email,
		                mobile: Number(mobile)
		            })
		        });

		        if (response.ok) {

		            const customer = await response.json();

		            // Store logged-in customer information
		            localStorage.setItem("customer", JSON.stringify(customer));

		            alert("Login successful!");

		            window.location.href = "Home.html";

		        } else if (response.status === 404) {

		            alert("Invalid email or mobile number.");

		        } else {

		            alert("Something went wrong. Please try again.");

		        }

		    } catch (error) {

		        console.error(error);
		        alert("Unable to connect to the server.");

		    }

		});
		</script>

        <!-- Registration Link -->

        <div class="register-link">

            Don't have an account?

            <a href="register.html">Register here</a>

        </div>

    </div>

</body>

</html>
