<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RideSphere | Vehicles</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Times New Roman", Times, serif;
            background: #D8C9B8;
            color: #2B1B14;
        }


        /* Navigation Bar */

        .navbar {
            height: 65px;
            background: #F1E8DC;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 48px;
            border-bottom: 1px solid #5A3A2B;
        }


        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #2B1B14;
        }


        .nav-links {
            display: flex;
            gap: 25px;
        }


        .nav-links a {
            text-decoration: none;
            color: #2B1B14;
            font-size: 16px;
        }


        .nav-links a:hover {
            color: #5A3A2B;
        }


        /* Page Heading */

        .page-header {
            background: #21140F;
            color: #E8DDD2;
            text-align: center;
            padding: 45px 20px;
        }


        .page-header h1 {
            font-size: 42px;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }


        .page-header p {
            font-size: 20px;
            font-style: italic;
        }


        /* Vehicle Section */

        .vehicle-section {
            padding: 50px;
            min-height: 500px;
        }


        .vehicle-container {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }


        /* Vehicle Card */

        .vehicle-card {
            width: 280px;
            background: #F1E8DC;
            border: 1px solid #5A3A2B;
            padding: 25px;
        }


        .vehicle-card h2 {
            color: #2B1B14;
            font-size: 25px;
            margin-bottom: 15px;
        }


        .vehicle-card p {
            font-size: 17px;
            margin-bottom: 10px;
            color: #3A241A;
        }


        .vehicle-card .fee {
            font-size: 21px;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 20px;
            color: #21140F;
        }


        .book-button {
            display: block;
            text-align: center;
            text-decoration: none;
            background: #21140F;
            color: #E8DDD2;
            padding: 12px;
            font-size: 17px;
            cursor: pointer;
            border: none;
            width: 100%;
            font-family: "Times New Roman", Times, serif;
        }


        .book-button:hover {
            background: #3A241A;
        }


        /* Loading */

        #loading {
            text-align: center;
            font-size: 20px;
            margin: 40px;
        }


        /* Error */

        #error {
            text-align: center;
            color: #7A1F1F;
            font-size: 19px;
            margin: 40px;
        }


        /* Footer */

        footer {
            height: 63px;
            background: #21140F;
            color: #E8DDD2;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            border-top: 1px solid #5A3A2B;
        }

    </style>

</head>


<body>


    <!-- Navigation -->

    <nav class="navbar">

        <div class="logo">
            🚗 RideSphere
        </div>


        <div class="nav-links">

            <a href="Home.html">
                Home
            </a>


            <a href="mybooking.html">
                My Bookings
            </a>

            <a href="payments.html">
                Payments
            </a>

            <a href="trips.html">
                My Trips
            </a>

            <a href="feedback.html">
                Feedback
            </a>

            <a href="profile.html">
                Profile
            </a>

            <a href="#" onclick="logout()">
                Logout
            </a>

        </div>

    </nav>


    <!-- Page Header -->

    <section class="page-header">

        <h1>
            OUR VEHICLES
        </h1>

        <p>
            Choose the perfect ride for your journey
        </p>

    </section>


    <!-- Vehicle Section -->

    <section class="vehicle-section">

        <div id="loading">
            Loading vehicles...
        </div>

        <div id="error"></div>

        <div
            class="vehicle-container"
            id="vehicleContainer">
        </div>

    </section>


    <!-- Footer -->

    <footer>

        © 2026 RideSphere | Vehicle Rental & Booking System

    </footer>


    <script>

        /* Check Login */

        const customerData = localStorage.getItem("customer");

        if (!customerData) {

            window.location.href = "login.html";

        }


        /* Load Vehicles */

        async function loadVehicles() {

            try {

                const response = await fetch(
                    "http://localhost:8082/vehicles"
                );


                if (!response.ok) {

                    throw new Error(
                        "Unable to load vehicles"
                    );

                }


                const vehicles = await response.json();


                document.getElementById("loading")
                    .style.display = "none";


                const container =
                    document.getElementById("vehicleContainer");


                if (vehicles.length === 0) {

                    container.innerHTML =
                        "<p>No vehicles available.</p>";

                    return;

                }


                vehicles.forEach(function(vehicle) {

                    const card =
                        document.createElement("div");

                    card.className = "vehicle-card";


                    card.innerHTML = `

                        <h2>
                            ${vehicle.vehiclename}
                        </h2>

                        <p>
                            <strong>Model:</strong>
                            ${vehicle.model}
                        </p>

                        <p>
                            <strong>Type:</strong>
                            ${vehicle.type}
                        </p>

                        <p class="fee">
                            ₹${vehicle.dailyfee} / day
                        </p>

                        <button
                            class="book-button"
                            onclick="bookVehicle(${vehicle.id})">

                            Book Now

                        </button>

                    `;


                    container.appendChild(card);

                });

            }


            catch (error) {

                console.error(
                    "Vehicle Error:",
                    error
                );


                document.getElementById("loading")
                    .style.display = "none";


                document.getElementById("error")
                    .textContent =
                    "Unable to load vehicles. Please try again.";

            }

        }


        /* Book Vehicle */

        function bookVehicle(vehicleId) {

            localStorage.setItem(
                "selectedVehicleId",
                vehicleId
            );

            window.location.href =
                "bookings.html";

        }


        /* Logout */

        function logout() {

            localStorage.removeItem("customer");

            localStorage.removeItem("selectedVehicleId");

            window.location.href = "login.html";

        }


        /* Load */

        loadVehicles();

    </script>


</body>

</html>
