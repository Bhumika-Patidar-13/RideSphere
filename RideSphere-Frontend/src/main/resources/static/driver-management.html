<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <title>Driver Management - RideSphere</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Times New Roman", serif;
            background: #2b211b;
            color: #f1e8dc;
            min-height: 100vh;
        }

        /* =========================
           NAVBAR
           ========================= */

        nav {
            height: 70px;
            background: #f1e8dc;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 40px;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #3b2a20;
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            text-decoration: none;
            color: #3b2a20;
            font-size: 17px;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }

        /* =========================
           CONTAINER
           ========================= */

        .container {
            width: 92%;
            max-width: 1150px;
            margin: 40px auto;
        }

        h1 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 30px;
        }

        /* =========================
           FORM CARD
           ========================= */

        .form-card {
            background: #3a2b22;
            border: 1px solid #6b5141;
            padding: 25px;
            margin-bottom: 35px;
        }

        .form-card h2 {
            margin-bottom: 20px;
            font-size: 23px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 7px;
            font-size: 16px;
        }

        .form-group input {
            padding: 11px;

            background: #2b211b;
            color: #f1e8dc;

            border: 1px solid #6b5141;

            font-family: "Times New Roman", serif;
            font-size: 16px;

            outline: none;
        }

        .form-group input:focus {
            border-color: #a58b76;
        }

        /* =========================
           BUTTONS
           ========================= */

        .button-area {
            margin-top: 20px;
        }

        button {
            padding: 11px 22px;

            background: #f1e8dc;
            color: #2b211b;

            border: none;

            font-family: "Times New Roman", serif;
            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #d8c4b3;
        }

        .cancel-btn {
            margin-left: 10px;

            background: transparent;
            color: #f1e8dc;

            border: 1px solid #8a6d5a;
        }

        .cancel-btn:hover {
            background: #f1e8dc;
            color: #2b211b;
        }

        /* =========================
           TABLE
           ========================= */

        .table-card {
            background: #3a2b22;
            border: 1px solid #6b5141;
            padding: 25px;
        }

        .table-card h2 {
            margin-bottom: 20px;
            font-size: 23px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 13px;
            text-align: left;
            border: 1px solid #6b5141;
        }

        th {
            background: #2b211b;
            font-size: 16px;
        }

        td {
            background: #33251e;
            font-size: 15px;
        }

        .edit-btn {
            padding: 7px 13px;
            margin-right: 5px;

            background: transparent;
            color: #f1e8dc;

            border: 1px solid #8a6d5a;

            font-weight: normal;
        }

        .delete-btn {
            padding: 7px 13px;

            background: transparent;
            color: #f1e8dc;

            border: 1px solid #8a6d5a;

            font-weight: normal;
        }

        .edit-btn:hover,
        .delete-btn:hover {
            background: #f1e8dc;
            color: #2b211b;
        }

        /* =========================
           MESSAGE
           ========================= */

        .message {
            margin-top: 15px;
            font-size: 16px;
        }

        .empty {
            text-align: center;
            padding: 25px;
            font-size: 18px;
        }

        /* =========================
           BACK
           ========================= */

        .back-btn {
            display: block;

            width: 220px;

            margin: 30px auto;

            padding: 13px;

            background: #f1e8dc;
            color: #2b211b;

            border: none;

            font-family: "Times New Roman", serif;
            font-size: 17px;
            font-weight: bold;

            cursor: pointer;
        }

        .back-btn:hover {
            background: #d8c4b3;
        }

        /* =========================
           RESPONSIVE
           ========================= */

        @media (max-width: 700px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            nav {
                padding: 0 20px;
            }

            .nav-links {
                gap: 12px;
            }

            .nav-links a {
                font-size: 14px;
            }

            .container {
                width: 95%;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         NAVBAR
         ========================= -->

    <nav>

        <div class="logo">
            🚗 RideSphere
        </div>

        <div class="nav-links">

            <a href="admin-dashboard.html">
                Dashboard
            </a>

            <a href="add-vehicle.html">
                Vehicles
            </a>

            <a href="driver-management.html">
                Drivers
            </a>

            <a href="#" onclick="logout()">
                Logout
            </a>

        </div>

    </nav>


    <!-- =========================
         MAIN
         ========================= -->

    <div class="container">

        <h1>
            Driver Management
        </h1>


        <!-- =========================
             ADD / EDIT DRIVER
             ========================= -->

        <div class="form-card">

            <h2 id="formTitle">
                Add Driver
            </h2>


            <input
                type="hidden"
                id="driverId">


            <div class="form-grid">


                <div class="form-group">

                    <label>
                        Driver Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter driver name"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter driver email"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        License Number
                    </label>

                    <input
                        type="number"
                        id="licenseNumber"
                        placeholder="Enter license number"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Specialization
                    </label>

                    <input
                        type="text"
                        id="specialization"
                        placeholder="Example: Car / Bike / SUV"
                        required>

                </div>


            </div>


            <div class="button-area">

                <button
                    onclick="saveDriver()"
                    id="saveButton">

                    Add Driver

                </button>


                <button
                    onclick="cancelEdit()"
                    class="cancel-btn"
                    id="cancelEditButton"
                    style="display:none;">

                    Cancel

                </button>

            </div>


            <div
                id="message"
                class="message">
            </div>

        </div>


        <!-- =========================
             DRIVER LIST
             ========================= -->

        <div class="table-card">

            <h2>
                All Drivers
            </h2>


            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>
                                ID
                            </th>

                            <th>
                                Name
                            </th>

                            <th>
                                Email
                            </th>

                            <th>
                                License Number
                            </th>

                            <th>
                                Specialization
                            </th>

                            <th>
                                Action
                            </th>

                        </tr>

                    </thead>


                    <tbody id="driverTableBody">

                        <tr>

                            <td
                                colspan="6"
                                class="empty">

                                Loading drivers...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>


        <button
            class="back-btn"
            onclick="goDashboard()">

            Back to Dashboard

        </button>

    </div>


<script>


    /* =========================
       DRIVER SERVICE
       ========================= */

    const DRIVER_SERVICE_URL =
        "http://localhost:8083/drivers";


    /* =========================
       LOAD DRIVERS
       ========================= */

    async function loadDrivers() {

        try {

            const response =
                await fetch(
                    DRIVER_SERVICE_URL
                );


            if (!response.ok) {

                throw new Error(
                    "Unable to load drivers"
                );

            }


            const drivers =
                await response.json();


            displayDrivers(drivers);

        }

        catch (error) {

            console.error(
                "Driver Error:",
                error
            );


            document.getElementById(
                "driverTableBody"
            ).innerHTML = `

                <tr>

                    <td
                        colspan="6"
                        class="empty">

                        Unable to connect to Driver Service.

                    </td>

                </tr>

            `;

        }

    }


    /* =========================
       DISPLAY DRIVERS
       ========================= */

    function displayDrivers(drivers) {

        const tbody =
            document.getElementById(
                "driverTableBody"
            );


        tbody.innerHTML = "";


        if (
            !drivers ||
            drivers.length === 0
        ) {

            tbody.innerHTML = `

                <tr>

                    <td
                        colspan="6"
                        class="empty">

                        No drivers available.

                    </td>

                </tr>

            `;

            return;

        }


        drivers.forEach(driver => {

            const row =
                document.createElement("tr");


            row.innerHTML = `

                <td>
                    ${driver.id}
                </td>

                <td>
                    ${driver.name}
                </td>

                <td>
                    ${driver.email}
                </td>

                <td>
                    ${driver.licenseNumber}
                </td>

                <td>
                    ${driver.specialization}
                </td>

                <td>

                    <button
                        class="edit-btn"
                        onclick="editDriver(${driver.id})">

                        Edit

                    </button>


                    <button
                        class="delete-btn"
                        onclick="deleteDriver(${driver.id})">

                        Delete

                    </button>

                </td>

            `;


            tbody.appendChild(row);

        });

    }


    /* =========================
       ADD / UPDATE DRIVER
       ========================= */

    async function saveDriver() {


        const id =
            document.getElementById(
                "driverId"
            ).value;


        const name =
            document.getElementById(
                "name"
            ).value.trim();


        const email =
            document.getElementById(
                "email"
            ).value.trim();


        const licenseNumber =
            document.getElementById(
                "licenseNumber"
            ).value;


        const specialization =
            document.getElementById(
                "specialization"
            ).value.trim();


        if (
            !name ||
            !email ||
            !licenseNumber ||
            !specialization
        ) {

            showMessage(
                "Please fill all fields.",
                true
            );

            return;

        }


        const driverData = {

            name: name,

            email: email,

            licenseNumber:
                Number(licenseNumber),

            specialization:
                specialization

        };


        try {


            let response;


            if (id) {

                /* UPDATE */

                response =
                    await fetch(
                        DRIVER_SERVICE_URL +
                        "/" +
                        id,
                        {
                            method: "PUT",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(
                                    driverData
                                )
                        }
                    );

            }

            else {

                /* ADD */

                response =
                    await fetch(
                        DRIVER_SERVICE_URL,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(
                                    driverData
                                )
                        }
                    );

            }


            if (!response.ok) {

                throw new Error(
                    "Unable to save driver"
                );

            }


            if (id) {

                showMessage(
                    "Driver updated successfully.",
                    false
                );

            }

            else {

                showMessage(
                    "Driver added successfully.",
                    false
                );

            }


            clearForm();

            loadDrivers();

        }

        catch (error) {

            console.error(
                "Save Driver Error:",
                error
            );


            showMessage(
                "Unable to connect to Driver Service.",
                true
            );

        }

    }


    /* =========================
       EDIT DRIVER
       ========================= */

    async function editDriver(id) {

        try {

            const response =
                await fetch(
                    DRIVER_SERVICE_URL +
                    "/" +
                    id
                );


            if (!response.ok) {

                throw new Error(
                    "Driver not found"
                );

            }


            const driver =
                await response.json();


            document.getElementById(
                "driverId"
            ).value =
                driver.id;


            document.getElementById(
                "name"
            ).value =
                driver.name;


            document.getElementById(
                "email"
            ).value =
                driver.email;


            document.getElementById(
                "licenseNumber"
            ).value =
                driver.licenseNumber;


            document.getElementById(
                "specialization"
            ).value =
                driver.specialization;


            document.getElementById(
                "formTitle"
            ).innerText =
                "Edit Driver";


            document.getElementById(
                "saveButton"
            ).innerText =
                "Update Driver";


            document.getElementById(
                "cancelEditButton"
            ).style.display =
                "inline-block";


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }

        catch (error) {

            console.error(
                "Edit Driver Error:",
                error
            );


            alert(
                "Unable to load driver details."
            );

        }

    }


    /* =========================
       DELETE DRIVER
       ========================= */

    async function deleteDriver(id) {


        const confirmDelete =
            confirm(
                "Are you sure you want to delete this driver?"
            );


        if (!confirmDelete) {

            return;

        }


        try {

            const response =
                await fetch(
                    DRIVER_SERVICE_URL +
                    "/" +
                    id,
                    {
                        method: "DELETE"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Unable to delete driver"
                );

            }


            alert(
                "Driver deleted successfully."
            );


            loadDrivers();

        }

        catch (error) {

            console.error(
                "Delete Driver Error:",
                error
            );


            alert(
                "Unable to delete driver."
            );

        }

    }


    /* =========================
       CLEAR FORM
       ========================= */

    function clearForm() {

        document.getElementById(
            "driverId"
        ).value = "";


        document.getElementById(
            "name"
        ).value = "";


        document.getElementById(
            "email"
        ).value = "";


        document.getElementById(
            "licenseNumber"
        ).value = "";


        document.getElementById(
            "specialization"
        ).value = "";


        document.getElementById(
            "formTitle"
        ).innerText =
            "Add Driver";


        document.getElementById(
            "saveButton"
        ).innerText =
            "Add Driver";


        document.getElementById(
            "cancelEditButton"
        ).style.display =
            "none";

    }


    /* =========================
       CANCEL EDIT
       ========================= */

    function cancelEdit() {

        clearForm();

    }


    /* =========================
       MESSAGE
       ========================= */

    function showMessage(
        message,
        error
    ) {

        const messageBox =
            document.getElementById(
                "message"
            );


        messageBox.innerText =
            message;


        if (error) {

            messageBox.style.color =
                "#d6c5b5";

        }

        else {

            messageBox.style.color =
                "#f1e8dc";

        }

    }


    /* =========================
       DASHBOARD
       ========================= */

    function goDashboard() {

        window.location.href =
            "admin-dashboard.html";

    }


    /* =========================
       LOGOUT
       ========================= */

    function logout() {

        localStorage.removeItem(
            "admin"
        );

        window.location.href =
            "admin-login.html";

    }


    /* =========================
       START
       ========================= */

    loadDrivers();

</script>


</body>

</html>
