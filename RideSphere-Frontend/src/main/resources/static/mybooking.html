<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <title>My Bookings - RideSphere</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Times New Roman", serif;
            background: #2b211b;
            color: #f1e8dc;
            min-height: 100vh;
        }

        /* =========================
           NAVBAR
           ========================= */

        nav {
            height: 70px;
            background: #f1e8dc;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #3b2a20;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            text-decoration: none;
            color: #3b2a20;
            font-size: 18px;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }

        /* =========================
           MAIN
           ========================= */

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 50px auto;
        }

        h1 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 35px;
        }

        /* =========================
           BOOKING CARD
           ========================= */

        .booking-card {
            background: #3a2b22;
            border: 1px solid #6b5141;
            padding: 25px;
            margin-bottom: 20px;

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.35);
        }

        .booking-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .booking-header h2 {
            font-size: 23px;
        }

        .status {
            padding: 7px 14px;
            border: 1px solid #8a6d5a;
            background: #2b211b;
            font-size: 15px;
        }

        .booking-info {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .info-box {
            background: #2b211b;
            border: 1px solid #6b5141;
            padding: 15px;
        }

        .info-box strong {
            display: block;
            margin-bottom: 6px;
            font-size: 15px;
        }

        .info-box span {
            font-size: 17px;
        }

        /* =========================
           VEHICLE
           ========================= */

        .vehicle-info {
            margin-top: 20px;
            padding: 15px;
            background: #2b211b;
            border: 1px solid #6b5141;
        }

        .vehicle-info h3 {
            margin-bottom: 8px;
        }

        /* =========================
           DRIVER
           ========================= */

        .driver-info {
            margin-top: 20px;
            padding: 18px;
            background: #2b211b;
            border: 1px solid #6b5141;
        }

        .driver-info h3 {
            margin-bottom: 15px;
            font-size: 20px;
        }

        .driver-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .driver-box {
            padding: 12px;
            border: 1px solid #5c4636;
            background: #33251e;
        }

        .driver-box strong {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .driver-box span {
            font-size: 16px;
        }

        .no-driver {
            color: #bfae9c;
            font-size: 16px;
        }

        .driver-error {
            color: #d6c5b5;
            font-size: 16px;
        }

        /* =========================
           BUTTON
           ========================= */

        .cancel-btn {
            margin-top: 20px;
            margin-right: 10px;
            padding: 10px 18px;

            background: transparent;
            color: #f1e8dc;

            border: 1px solid #8a6d5a;

            font-family: "Times New Roman", serif;
            font-size: 16px;

            cursor: pointer;
        }

        .cancel-btn:hover {
            background: #f1e8dc;
            color: #2b211b;
        }

        .cancel-btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        /* =========================
           NO BOOKINGS
           ========================= */

        .no-bookings {
            text-align: center;
            background: #3a2b22;
            border: 1px solid #6b5141;
            padding: 40px;
            font-size: 20px;
        }

        /* =========================
           LOADING
           ========================= */

        .loading {
            text-align: center;
            font-size: 20px;
        }

        /* =========================
           BACK BUTTON
           ========================= */

        .back-btn {
            display: block;
            width: 220px;

            margin: 30px auto;
            padding: 13px;

            background: #f1e8dc;
            color: #2b211b;

            border: none;

            font-family: "Times New Roman", serif;
            font-size: 17px;
            font-weight: bold;

            cursor: pointer;
        }

        .back-btn:hover {
            background: #d8c4b3;
        }

        /* =========================
           RESPONSIVE
           ========================= */

        @media (max-width: 700px) {

            .booking-info {
                grid-template-columns: 1fr;
            }

            .driver-grid {
                grid-template-columns: 1fr;
            }

            nav {
                padding: 0 20px;
            }

            .nav-links {
                gap: 15px;
            }

            .nav-links a {
                font-size: 15px;
            }

            .container {
                width: 95%;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         NAVBAR
         ========================= -->

    <nav>

        <div class="logo">
            🚗 RideSphere
        </div>

        <div class="nav-links">

            <a href="Home.html">
                Dashboard
            </a>

            <a href="vehicles.html">
                Vehicles
            </a>

            <a href="mybooking.html">
                My Bookings
            </a>

            <a href="#" onclick="logout()">
                Logout
            </a>

        </div>

    </nav>


    <!-- =========================
         MAIN
         ========================= -->

    <div class="container">

        <h1>
            My Bookings
        </h1>

        <div id="bookingContainer">

            <div class="loading">
                Loading bookings...
            </div>

        </div>

        <button
            class="back-btn"
            onclick="goBack()">

            Back to Dashboard

        </button>

    </div>


<script>


    /* =========================
       SERVICE URLS
       ========================= */

    const BOOKING_SERVICE_URL =
        "http://localhost:8084/bookings";

    const PAYMENT_SERVICE_URL =
        "http://localhost:8085/payments";

    /*
       Change 8083 if your Driver Service
       is running on another port.
    */

    const DRIVER_SERVICE_URL =
        "http://localhost:8083/drivers";


    /* =========================
       CHECK CUSTOMER LOGIN
       ========================= */

    const customerData =
        localStorage.getItem("customer");


    if (!customerData) {

        window.location.href =
            "login.html";

    }


    const customer =
        JSON.parse(customerData);


    /* =========================
       LOAD BOOKINGS
       ========================= */

    async function loadBookings() {

        try {

            const response =
                await fetch(
                    BOOKING_SERVICE_URL +
                    "/customer/" +
                    customer.id
                );


            if (!response.ok) {

                throw new Error(
                    "Unable to load bookings"
                );

            }


            const bookings =
                await response.json();


            await displayBookings(bookings);

        }

        catch (error) {

            console.error(
                "Booking Error:",
                error
            );


            document.getElementById(
                "bookingContainer"
            ).innerHTML = `

                <div class="no-bookings">

                    Unable to load your bookings.

                </div>

            `;

        }

    }


    /* =========================
       GET DRIVER DETAILS
       ========================= */

    async function getDriver(driverId) {

        if (
            driverId === null ||
            driverId === undefined ||
            driverId === ""
        ) {

            return null;

        }


        try {

            const response =
                await fetch(
                    DRIVER_SERVICE_URL +
                    "/" +
                    driverId
                );


            if (!response.ok) {

                console.error(
                    "Driver not found:",
                    driverId
                );

                return null;

            }


            const driver =
                await response.json();


            return driver;

        }

        catch (error) {

            console.error(
                "Driver Error:",
                error
            );

            return null;

        }

    }


    /* =========================
       DISPLAY BOOKINGS
       ========================= */

    async function displayBookings(bookings) {

        const container =
            document.getElementById(
                "bookingContainer"
            );


        if (
            !bookings ||
            bookings.length === 0
        ) {

            container.innerHTML = `

                <div class="no-bookings">

                    You have no bookings yet.

                </div>

            `;

            return;

        }


        container.innerHTML = "";


        for (const booking of bookings) {


            /* =========================
               GET DRIVER
               ========================= */

            let driver = null;


            if (
                booking.driverRequired === true &&
                booking.driverId !== null &&
                booking.driverId !== undefined
            ) {

                driver =
                    await getDriver(
                        booking.driverId
                    );

            }


            /* =========================
               DRIVER HTML
               ========================= */

            let driverHTML = "";


            if (
                booking.driverRequired === false ||
                booking.driverRequired === null ||
                booking.driverRequired === undefined
            ) {

                driverHTML = `

                    <div class="driver-info">

                        <h3>
                            Driver Information
                        </h3>

                        <p class="no-driver">
                            No driver was requested for this booking.
                        </p>

                    </div>

                `;

            }

            else if (
                booking.driverRequired === true &&
                driver
            ) {

                driverHTML = `

                    <div class="driver-info">

                        <h3>
                            Driver Information
                        </h3>

                        <div class="driver-grid">

                            <div class="driver-box">

                                <strong>
                                    Driver Name
                                </strong>

                                <span>
                                    ${driver.name}
                                </span>

                            </div>


                            <div class="driver-box">

                                <strong>
                                    Email
                                </strong>

                                <span>
                                    ${driver.email}
                                </span>

                            </div>


                            <div class="driver-box">

                                <strong>
                                    License Number
                                </strong>

                                <span>
                                    ${driver.licenseNumber}
                                </span>

                            </div>


                            <div class="driver-box">

                                <strong>
                                    Specialization
                                </strong>

                                <span>
                                    ${driver.specialization}
                                </span>

                            </div>

                        </div>

                    </div>

                `;

            }

            else {

                driverHTML = `

                    <div class="driver-info">

                        <h3>
                            Driver Information
                        </h3>

                        <p class="driver-error">

                            Driver information could not
                            be loaded.

                        </p>

                    </div>

                `;

            }


            /* =========================
               CREATE CARD
               ========================= */

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "booking-card";


            /* =========================
               CHECK PAYMENT
               ========================= */

            let paymentDone = false;


            try {

                const paymentResponse =
                    await fetch(
                        PAYMENT_SERVICE_URL +
                        "/bookings/" +
                        booking.id
                    );


                if (paymentResponse.ok) {

                    const payment =
                        await paymentResponse.json();


                    if (
                        payment.status === "PAID"
                    ) {

                        paymentDone = true;

                    }

                }

            }

            catch (error) {

                console.error(
                    "Payment Check Error:",
                    error
                );

            }


            /* =========================
               PAYMENT BUTTON
               ========================= */

            let paymentButton = "";


            if (paymentDone) {

                paymentButton = `

                    <button
                        class="cancel-btn"
                        disabled>

                        PAID

                    </button>

                `;

            }

            else {

                paymentButton = `

                    <button
                        class="cancel-btn"
                        onclick="makePayment(${booking.id})">

                        Pay Now

                    </button>

                `;

            }


            /* =========================
               BOOKING CARD HTML
               ========================= */

            card.innerHTML = `

                <div class="booking-header">

                    <h2>

                        Booking #${booking.id}

                    </h2>

                    <div class="status">

                        ${booking.status}

                    </div>

                </div>


                <div class="booking-info">


                    <div class="info-box">

                        <strong>
                            Booking Date
                        </strong>

                        <span>
                            ${booking.date}
                        </span>

                    </div>


                    <div class="info-box">

                        <strong>
                            Duration
                        </strong>

                        <span>

                            ${booking.durationdays}
                            day(s)

                        </span>

                    </div>


                    <div class="info-box">

                        <strong>
                            Vehicle ID
                        </strong>

                        <span>

                            ${booking.vehicleId}

                        </span>

                    </div>


                    <div class="info-box">

                        <strong>
                            Driver Required
                        </strong>

                        <span>

                            ${
                                booking.driverRequired
                                ? "Yes"
                                : "No"
                            }

                        </span>

                    </div>


                </div>


                <!-- VEHICLE -->

                <div class="vehicle-info">

                    <h3>
                        Vehicle Information
                    </h3>

                    <p>

                        Vehicle ID:
                        ${booking.vehicleId}

                    </p>

                </div>


                <!-- DRIVER -->

                ${driverHTML}


                <!-- PAYMENT -->

                ${paymentButton}


                <!-- CANCEL -->

                <button
                    class="cancel-btn"
                    onclick="cancelBooking(${booking.id})">

                    Cancel Booking

                </button>

            `;


            container.appendChild(card);

        }

    }


    /* =========================
       PAYMENT
       ========================= */

    function makePayment(bookingId) {

        localStorage.setItem(
            "paymentBookingId",
            bookingId
        );


        window.location.href =
            "payments.html";

    }


    /* =========================
       CANCEL BOOKING
       ========================= */

    async function cancelBooking(id) {


        const confirmCancel =
            confirm(
                "Are you sure you want to cancel this booking?"
            );


        if (!confirmCancel) {

            return;

        }


        try {

            const response =
                await fetch(
                    BOOKING_SERVICE_URL +
                    "/" +
                    id,
                    {
                        method: "DELETE"
                    }
                );


            if (response.ok) {

                alert(
                    "Booking cancelled successfully."
                );


                loadBookings();

            }

            else {

                alert(
                    "Unable to cancel booking."
                );

            }

        }


        catch (error) {

            console.error(
                "Cancel Booking Error:",
                error
            );


            alert(
                "Unable to connect to Booking Service."
            );

        }

    }


    /* =========================
       BACK
       ========================= */

    function goBack() {

        window.location.href =
            "Home.html";

    }


    /* =========================
       LOGOUT
       ========================= */

    function logout() {

        localStorage.removeItem(
            "customer"
        );

        localStorage.removeItem(
            "selectedVehicleId"
        );

        window.location.href =
            "index.html";

    }


    /* =========================
       START
       ========================= */

    loadBookings();


</script>


</body>

</html>
