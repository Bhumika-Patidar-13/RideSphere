
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Trips - RideSphere</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Times New Roman", serif;
            background: #1f1712;
            color: #f1e8dc;
            min-height: 100vh;
        }

        /* NAVBAR */

        nav {
            width: 100%;
            background: #2d211a;
            border-bottom: 1px solid #5c4636;
            padding: 15px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #f1e8dc;
        }

        nav a {
            color: #d8c7b5;
            text-decoration: none;
            margin-left: 25px;
            font-size: 17px;
        }

        nav a:hover {
            color: white;
        }

        /* MAIN */

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 40px auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 32px;
        }

        /* FORM */

        .form-box {
            background: #2d211a;
            border: 1px solid #5c4636;
            padding: 25px;
            margin-bottom: 35px;
        }

        .form-box h2 {
            margin-bottom: 20px;
            font-size: 24px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .input-box {
            display: flex;
            flex-direction: column;
        }

        .input-box label {
            margin-bottom: 7px;
            color: #cbb9a7;
            font-size: 16px;
        }

        .input-box input {
            padding: 11px;
            background: #1f1712;
            border: 1px solid #5c4636;
            color: #f1e8dc;
            font-family: "Times New Roman", serif;
            font-size: 16px;
            outline: none;
        }

        .input-box input:focus {
            border-color: #a88c73;
        }

        /* BUTTONS */

        .buttons {
            margin-top: 22px;
            display: flex;
            gap: 12px;
        }

        button {
            padding: 11px 20px;
            border: 1px solid #5c4636;
            background: #4a3629;
            color: #f1e8dc;
            font-family: "Times New Roman", serif;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #5c4636;
        }

        .cancel-btn {
            display: none;
        }

        /* TABLE */

        .table-box {
            background: #2d211a;
            border: 1px solid #5c4636;
            padding: 20px;
            overflow-x: auto;
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .table-header h2 {
            font-size: 24px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #5c4636;
            padding: 12px;
            text-align: center;
        }

        th {
            background: #1f1712;
            color: #f1e8dc;
            font-size: 17px;
        }

        td {
            color: #d8c7b5;
            background: #2d211a;
        }

        .edit-btn {
            background: #4a3629;
            margin-right: 5px;
        }

        .delete-btn {
            background: #3a211c;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            font-size: 17px;
        }

        @media(max-width: 700px) {

            nav {
                padding: 15px;
                flex-direction: column;
                gap: 12px;
            }

            nav a {
                margin-left: 10px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .container {
                width: 95%;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->

    <nav>

        <div class="logo">
            🚗 RideSphere
        </div>

        <div>
            <a href="admin-dashboard.html">Dashboard</a>
            <a href="add-vehicle.html">Vehicles</a>
            <a href="trips.html">Trips</a>
        </div>

    </nav>


    <div class="container">

        <h1>Trip Management</h1>


        <!-- ADD / UPDATE FORM -->

        <div class="form-box">

            <h2 id="formTitle">Add New Trip</h2>

            <form id="tripForm">

                <div class="form-grid">

                    <div class="input-box">
                        <label>Trip Title</label>
                        <input
                            type="text"
                            id="title"
                            placeholder="Enter trip title"
                            required>
                    </div>


                    <div class="input-box">
                        <label>Route Details</label>
                        <input
                            type="text"
                            id="routedetails"
                            placeholder="Example: Indore to Bhopal"
                            required>
                    </div>


                    <div class="input-box">
                        <label>Vehicle ID</label>
                        <input
                            type="number"
                            id="vehicleid"
                            placeholder="Enter vehicle ID"
                            required>
                    </div>


                    <div class="input-box">
                        <label>Driver ID</label>
                        <input
                            type="number"
                            id="driverid"
                            placeholder="Enter driver ID"
                            required>
                    </div>


                    <div class="input-box">
                        <label>Due Date</label>
                        <input
                            type="date"
                            id="duedate"
                            required>
                    </div>

                </div>


                <div class="buttons">

                    <button type="submit" id="submitBtn">
                        Add Trip
                    </button>

                    <button
                        type="button"
                        class="cancel-btn"
                        id="cancelBtn"
                        onclick="cancelEdit()">
                        Cancel
                    </button>

                </div>

            </form>


            <div class="message" id="message"></div>

        </div>


        <!-- TRIP TABLE -->

        <div class="table-box">

            <div class="table-header">

                <h2>All Trips</h2>

                <button onclick="loadTrips()">
                    🔄 Refresh
                </button>

            </div>


            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Route</th>
                        <th>Vehicle ID</th>
                        <th>Driver ID</th>
                        <th>Due Date</th>
                        <th>Action</th>
                    </tr>

                </thead>


                <tbody id="tripTableBody">

                    <tr>
                        <td colspan="7">
                            Loading trips...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>


    <script>

        const API_URL = "http://localhost:8086/trips";

        let editingTripId = null;


        /* =========================
           LOAD ALL TRIPS
        ========================= */

        function loadTrips() {

            fetch(API_URL)

                .then(response => {

                    if (!response.ok) {
                        throw new Error("Unable to load trips");
                    }

                    return response.json();

                })

                .then(trips => {

                    const tableBody =
                        document.getElementById("tripTableBody");

                    tableBody.innerHTML = "";


                    if (trips.length === 0) {

                        tableBody.innerHTML = `
                            <tr>
                                <td colspan="7">
                                    No trips available
                                </td>
                            </tr>
                        `;

                        return;
                    }


                    trips.forEach(trip => {

                        const row = document.createElement("tr");

                        row.innerHTML = `

                            <td>${trip.id}</td>

                            <td>${trip.title}</td>

                            <td>${trip.routedetails}</td>

                            <td>${trip.vehicleid}</td>

                            <td>${trip.driverid}</td>

                            <td>${trip.duedate}</td>

                            <td>

                                <button
                                    class="edit-btn"
                                    onclick="editTrip(${trip.id})">
                                    Edit
                                </button>

                                <button
                                    class="delete-btn"
                                    onclick="deleteTrip(${trip.id})">
                                    Delete
                                </button>

                            </td>

                        `;

                        tableBody.appendChild(row);

                    });

                })

                .catch(error => {

                    console.error(error);

                    document.getElementById("tripTableBody").innerHTML = `

                        <tr>
                            <td colspan="7">
                                Unable to load trips
                            </td>
                        </tr>

                    `;

                });

        }


        /* =========================
           ADD / UPDATE TRIP
        ========================= */

        document
            .getElementById("tripForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();


                const trip = {

                    title:
                        document.getElementById("title").value,

                    routedetails:
                        document.getElementById("routedetails").value,

                    vehicleid:
                        Number(
                            document.getElementById("vehicleid").value
                        ),

                    driverid:
                        Number(
                            document.getElementById("driverid").value
                        ),

                    duedate:
                        document.getElementById("duedate").value

                };


                /* =========================
                   UPDATE
                ========================= */

                if (editingTripId !== null) {

                    fetch(API_URL + "/" + editingTripId, {

                        method: "PUT",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify(trip)

                    })

                    .then(response => {

                        if (!response.ok) {
                            throw new Error("Update failed");
                        }

                        return response.json();

                    })

                    .then(data => {

                        showMessage("Trip updated successfully.");

                        resetForm();

                        loadTrips();

                    })

                    .catch(error => {

                        console.error(error);

                        showMessage(
                            "Unable to update trip."
                        );

                    });

                }


                /* =========================
                   ADD
                ========================= */

                else {

                    fetch(API_URL, {

                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify(trip)

                    })

                    .then(response => {

                        if (!response.ok) {
                            throw new Error("Add trip failed");
                        }

                        return response.text();

                    })

                    .then(data => {

                        showMessage(
                            "Trip added successfully."
                        );

                        resetForm();

                        loadTrips();

                    })

                    .catch(error => {

                        console.error(error);

                        showMessage(
                            "Unable to add trip."
                        );

                    });

                }

            });


        /* =========================
           EDIT TRIP
        ========================= */

        function editTrip(id) {

            fetch(API_URL + "/" + id)

                .then(response => {

                    if (!response.ok) {
                        throw new Error("Trip not found");
                    }

                    return response.json();

                })

                .then(trip => {

                    editingTripId = trip.id;


                    document.getElementById("title").value =
                        trip.title;

                    document.getElementById("routedetails").value =
                        trip.routedetails;

                    document.getElementById("vehicleid").value =
                        trip.vehicleid;

                    document.getElementById("driverid").value =
                        trip.driverid;

                    document.getElementById("duedate").value =
                        trip.duedate;


                    document.getElementById("formTitle")
                        .innerText = "Update Trip";


                    document.getElementById("submitBtn")
                        .innerText = "Update Trip";


                    document.getElementById("cancelBtn")
                        .style.display = "block";


                    window.scrollTo({
                        top: 0,
                        behavior: "smooth"
                    });

                })

                .catch(error => {

                    console.error(error);

                    showMessage(
                        "Unable to load trip details."
                    );

                });

        }


        /* =========================
           DELETE TRIP
        ========================= */

        function deleteTrip(id) {

            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this trip?"
                );


            if (!confirmDelete) {
                return;
            }


            fetch(API_URL + "/" + id, {

                method: "DELETE"

            })

            .then(response => {

                if (!response.ok) {
                    throw new Error("Delete failed");
                }

                showMessage(
                    "Trip deleted successfully."
                );

                loadTrips();

            })

            .catch(error => {

                console.error(error);

                showMessage(
                    "Unable to delete trip."
                );

            });

        }


        /* =========================
           CANCEL EDIT
        ========================= */

        function cancelEdit() {

            resetForm();

        }


        /* =========================
           RESET FORM
        ========================= */

        function resetForm() {

            document
                .getElementById("tripForm")
                .reset();


            editingTripId = null;


            document.getElementById("formTitle")
                .innerText = "Add New Trip";


            document.getElementById("submitBtn")
                .innerText = "Add Trip";


            document.getElementById("cancelBtn")
                .style.display = "none";

        }


        /* =========================
           MESSAGE
        ========================= */

        function showMessage(message) {

            const messageBox =
                document.getElementById("message");

            messageBox.innerText = message;


            setTimeout(function() {

                messageBox.innerText = "";

            }, 3000);

        }


        /* =========================
           INITIAL LOAD
        ========================= */

        loadTrips();

    </script>

</body>

</html>
