<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RideSphere | Contact</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Times New Roman", Times, serif;
            background: #0D0907;
            color: #E8DDD2;
            min-height: 100vh;
        }

        /* Navbar */

        nav {
            height: 80px;
            padding: 0 70px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            background: #21140F;
            border-bottom: 1px solid #5A3A2B;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 35px;
        }

        .nav-links a {
            color: #E8DDD2;
            text-decoration: none;
            font-size: 18px;
        }

        .nav-links a:hover {
            color: #D4C5B8;
        }

        /* Contact */

        .contact {
            min-height: calc(100vh - 130px);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px 70px;
        }

        .contact-container {
            width: 100%;
            max-width: 900px;

            text-align: center;
        }

        .contact-container h1 {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .contact-container > p {
            font-size: 19px;
            color: #BFAFA4;
            margin-bottom: 35px;
        }

        /* Contact Details */

        .contact-details {
            display: flex;
            justify-content: center;
            gap: 25px;
        }

        .contact-box {
            width: 260px;
            padding: 25px;

            background: #21140F;
            border: 1px solid #5A3A2B;
        }

        .contact-box h2 {
            font-size: 23px;
            margin-bottom: 12px;
        }

        .contact-box p {
            font-size: 17px;
            color: #BFAFA4;
        }

        .contact-box a {
            color: #BFAFA4;
            text-decoration: none;
        }

        .contact-box a:hover {
            color: #E8DDD2;
        }

        /* Footer */

        footer {
            height: 50px;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #21140F;
            border-top: 1px solid #5A3A2B;

            color: #9B8C82;
            font-size: 14px;
        }

    </style>

</head>

<body>

    <!-- Navbar -->

    <nav>

        <div class="logo">
            RideSphere
        </div>

        <div class="nav-links">

            <a href="index.html">Home</a>

            <a href="about.html">About</a>

            <a href="contact.html">Contact</a>

            <a href="login.html">Login</a>

            <a href="register.html">Register</a>

        </div>

    </nav>


    <!-- Contact Section -->

    <section class="contact">

        <div class="contact-container">

            <h1>Contact Us</h1>

            <p>
                Have any questions about RideSphere?
                Get in touch with us.
            </p>


            <div class="contact-details">

                <div class="contact-box">

                    <h2>Email</h2>

                    <p>
                        <a href="mailto:ridersphere@gmail.com">
                            ridersphere@gmail.com
                        </a>
                    </p>

                </div>


                <div class="contact-box">

                    <h2>Phone</h2>

                    <p>
                        +91 98765 XXXXX
                    </p>

                </div>


                <div class="contact-box">

                    <h2>Address</h2>

                    <p>
                        Indore, Madhya Pradesh, India
                    </p>

                </div>

            </div>

        </div>

    </section>


    <!-- Footer -->

    <footer>

        © 2026 RideSphere. All Rights Reserved.

    </footer>

</body>

</html>
