<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RideSphere | Customer Home</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Times New Roman", Times, serif;
            background: #D8C9B8;
            color: #2B1B14;
        }


        /* Navigation Bar */

        .navbar {
            height: 65px;
            background-color: #F1E8DC;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 48px;
            border-bottom: 1px solid #5A3A2B;
        }


        /* Logo */

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #2B1B14;
        }


        /* Navigation Links */

        .nav-links {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: #2B1B14;
            font-size: 16px;
        }

        .nav-links a:hover {
            color: #5A3A2B;
        }


        /* Welcome Section */

        .hero {
            min-height: 390px;
            background: #21140F;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #E8DDD2;
            padding: 40px 20px;
        }


        .welcome {
            font-size: 20px;
            margin-bottom: 15px;
            color: #D4C5B8;
        }


        .hero h1 {
            font-size: 46px;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }


        .hero p {
            font-size: 24px;
            font-style: italic;
            margin-bottom: 35px;
        }


        /* Hero Buttons */

        .hero-buttons {
            display: flex;
            gap: 22px;
        }


        .hero-buttons a {
            text-decoration: none;
            background: #E8DDD2;
            color: #21140F;
            padding: 13px 28px;
            font-size: 17px;
        }


        .hero-buttons a:hover {
            background: #D4C5B8;
        }


        /* Explore Section */

        .explore-section {
            min-height: 300px;
            background: #D8C9B8;
            text-align: center;
            padding: 55px 20px;
        }


        .explore-section h2 {
            font-size: 34px;
            margin-bottom: 40px;
            color: #2B1B14;
        }


        /* Explore Buttons */

        .explore-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }


        .explore-buttons a {
            text-decoration: none;
            background: #21140F;
            color: #E8DDD2;
            padding: 14px 28px;
            font-size: 17px;
        }


        .explore-buttons a:hover {
            background: #3A241A;
        }


        /* Footer */

        footer {
            height: 63px;
            background: #21140F;
            color: #E8DDD2;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            border-top: 1px solid #5A3A2B;
        }

    </style>

</head>


<body>


    <!-- Navigation Bar -->

    <nav class="navbar">

        <div class="logo">
            🚗 RideSphere
        </div>


        <div class="nav-links">

            <a href="Home.html">
                Home
            </a>

            <a href="vehicles.html">
                Vehicles
            </a>

            <a href="mybooking.html">
                My Bookings
            </a>

            <a href="payments.html">
                Payments
            </a>

            <a href="trips.html">
                My Trips
            </a>

            <a href="feedback.html">
                Feedback
            </a>

            <a href="profile.html">
                Profile
            </a>

            <a href="index.html">
                Logout
            </a>

        </div>

    </nav>


    <!-- Welcome Section -->

    <section class="hero">

        <div class="welcome">
            Welcome, <span id="customerName">Customer</span>
        </div>


        <h1>
            WELCOME TO RIDESPHERE
        </h1>


        <p>
            Your Ride, Our Priority
        </p>


        <div class="hero-buttons">

            <a href="vehicles.html">
                Explore Vehicles
            </a>

            <a href="bookings.html">
                My Bookings
            </a>

        </div>

    </section>


    <!-- Explore Section -->

    <section class="explore-section">

        <h2>
            Explore RideSphere
        </h2>


        <div class="explore-buttons">

            <a href="vehicles.html">
                Vehicles
            </a>

            <a href="mybooking.html">
                My Bookings
            </a>

            <a href="payments.html">
                Payments
            </a>

            <a href="trips.html">
                My Trips
            </a>

            <a href="feedback.html">
                Feedback
            </a>

        </div>

    </section>


    <!-- Footer -->

    <footer>

        © 2026 RideSphere | Vehicle Rental & Booking System

    </footer>


    <!-- JavaScript -->

    <script>

        /* Get logged-in customer */

        const customerData = localStorage.getItem("customer");


        /* If customer is not logged in */

        if (!customerData) {

            window.location.href = "login.html";

        }


        /* Display customer name */

        else {

            const customer = JSON.parse(customerData);

            document.getElementById("customerName").textContent =
                customer.name;

        }


        /* Logout */

        function logout() {

            localStorage.removeItem("customer");

            window.location.href = "login.html";

        }

    </script>


</body>

</html>
